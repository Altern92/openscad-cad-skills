# Single source of truth for every mandatory/opt-in rule in scad-modeler.
# Read by scripts/check_rules.py (references/rules_enforcement.md, L4).
#
# Each rule:
#   id       - stable identifier, cited in the §8 report
#   rule     - human-readable statement of the requirement
#   applies  - a detector check_rules.py knows how to evaluate on its own:
#              "always" | "file_exists:<path>" | "json_true:<path>#<dot.key>"
#   kind     - "auto" (check_rules.py runs `gate` itself and records the exit
#              code) or "manual" (no script can verify this one -- content
#              quality, not a file's existence. check_rules.py prints it and
#              the model MUST self-assess it explicitly in §8; it is not
#              silently skipped just because nothing can auto-check it)
#   gate     - shell command to run for "auto" rules (null for "manual")
#   success_pattern - optional regex. If present, PASS/FAIL for this rule is
#              decided by searching the gate's own stdout+stderr for this
#              pattern, NOT by the gate's process exit code. Needed when the
#              gate is a multi-purpose script (validate_scad.sh --all runs
#              several independent checks in one render pass, each printing
#              its own "CHECK_RESULT <name>=PASS|FAIL|SKIP" line) whose
#              overall exit code can be non-zero because of a completely
#              unrelated check failing -- using the bare exit code there
#              would conflate "this specific check failed" with "some other
#              check failed and this one never even ran", a real, reported
#              ambiguity (INCIDENTS.md, 2026-08-19). Rules with a gate that
#              calls one single-purpose script directly (R-01, R-02, R-06,
#              R-11, R-12) don't need this -- their exit code already means
#              exactly one thing.
#
# {project_dir} and {skill_dir} are substituted by check_rules.py.

rules:
  - id: R-01
    rule: "Intake (§0): design_manifest.json/requirements.json exists and is schema-valid, no unresolved 'unknown' parameters"
    applies: "file_exists:design_manifest.json,requirements.json"
    kind: auto
    gate: "python3 {skill_dir}/scripts/check_intake.py"

  - id: R-02
    rule: "Planning (§0.5): plan.md exists, 2+ architecture options, a confirmed Decision, every layout.scad part present"
    applies: "file_exists:plan.md"
    kind: auto
    gate: "python3 {skill_dir}/scripts/check_plan.py --plan {project_dir}/plan.md"

  - id: R-03
    rule: "Physical assembly narrative (§0.6): insertion path, shared-part neighbors, retention, purchased-part fit answered in writing for every feature touching a bearing/shaft/fastener/purchased part or sharing a union() with another feature"
    applies: "always"
    kind: manual
    gate: null

  - id: R-04
    rule: "Connectivity (§7): every printed part renders as one connected body (or declares EXPECTED_BODIES)"
    # 'always' was wrong: with no parts to render the gate correctly reports
    #   CHECK_RESULT connectivity=SKIP
    # and the old success_pattern read SKIP as success, so an EMPTY project
    # directory scored a PASS on the connectivity rule (INCIDENTS.md,
    # 2026-09-12). A rule that cannot be exercised is N/A, not PASS -- and a
    # vacuous PASS is worse than a FAIL because it claims work that never ran.
    applies: "glob_exists:parts/*.scad,assembly.scad"
    kind: auto
    gate: "bash {skill_dir}/scripts/validate_scad.sh --all"
    success_pattern: "CHECK_RESULT connectivity=PASS"

  - id: R-13
    rule: "Analytic pre-flight (§7): every assert() in params.scad passes, evaluated before any part is rendered -- catches purely algebraic defects (e.g. r1+r2 > center_distance) for near-zero cost instead of discovering them via a full mesh-based validation round"
    applies: "file_exists:params.scad"
    kind: auto
    gate: "bash {skill_dir}/scripts/validate_scad.sh --all"
    # SKIP removed 2026-09-12 (latent, not active). analytic_bounds emits SKIP only
    # when params.scad is absent -- and `applies` above already makes the rule N/A
    # in exactly that case, so SKIP is unreachable here. Leaving it accepted would
    # reinstate a vacuous pass the day the gate changes, silently.
    success_pattern: "CHECK_RESULT analytic_bounds=PASS"

  - id: R-05
    rule: "After ANY change, the whole validate_scad.sh --all is re-run from the top, not just the one check that failed"
    applies: "always"
    kind: manual
    gate: null

  - id: R-06
    rule: "Bore reachability (§0.6/§7): every declared bore in bores.json is open along its full path, not sealed behind material"
    applies: "file_exists:bores.json"
    kind: auto
    gate: "python3 {skill_dir}/scripts/check_bore_reachability.py --bores {project_dir}/bores.json {project_dir}/build/*.stl"

  - id: R-07
    rule: "Sub-feature overlap (§0.6/§7): named sub-modules sharing one part's union() don't overlap invisibly, unless declared as an intentional fusion"
    applies: "always"
    kind: manual
    gate: null

  - id: R-08
    rule: "Collision/clearance (§7): 3+ positioned STATIC (non-moving) parts checked for unintended interference and insufficient clearance -- if the assembly moves, this is already covered by R-09's auto-trigger instead"
    applies: "always"
    kind: manual
    gate: null

  - id: R-09
    rule: "Motion sweep (§7): if joints.json declares a non-empty 'motion' array, static collisions are checked first, then a full motion sweep -- both auto-triggered by validate_scad.sh --all against positioned parts rendered via assembly.scad's MODE=\"part\" switch"
    applies: "json_true:joints.json#motion"
    kind: auto
    gate: "bash {skill_dir}/scripts/validate_scad.sh --all"
    # SKIP removed: when joints.json DECLARES motion the sweep must actually run.
    # Accepting SKIP let a project with a motion array but no assembly.scad score
    # [PASS] R-09 / exit 0 while motion_sweep.py had never executed -- the same
    # vacuous-PASS class R-04 was fixed for (adversarial review, INCIDENTS.md
    # 2026-09-12). Motion declared and no positioned parts = a real gap, not N/A.
    success_pattern: "CHECK_RESULT mechanics=PASS"

  - id: R-10
    rule: "Change-propagation (§0/choice tree): a parameter edit's affected chain is traced with check_dependencies.py before assuming only the touched part needs re-checking"
    applies: "always"
    kind: manual
    gate: null

  - id: R-11
    rule: "Unresolved critical assumptions (§7): no Criticality:Critical row in calculations.md's decisions log left unresolved"
    applies: "file_exists:calculations.md"
    kind: auto
    gate: "python3 {skill_dir}/scripts/check_assumptions.py --calc {project_dir}/calculations.md"

  - id: R-12
    rule: "Service envelope (§7): service_envelope.md has no blank field"
    applies: "file_exists:service_envelope.md"
    kind: auto
    gate: "python3 {skill_dir}/scripts/check_service_envelope.py --envelope {project_dir}/service_envelope.md"

  - id: R-14
    rule: "Calibration coupon (openscad-cad SKILL.md §4.5): for a load-bearing or precision-sensitive fit (bearing press fit, structural pin -- not a generous loose-clearance hole) declared in bores.json/joints.json with no calibration profile found (doctor.py), a calibration_coupon() print (openscad-cad/references/patterns.scad Pattern 5) was PROPOSED before committing to the final dimension, not just defaulted to Tier 2/uncalibrated silently"
    applies: "file_exists:bores.json,joints.json"
    kind: manual
    gate: null

  - id: R-15
    rule: "Margin provenance (2026-08-19 Phase-2 Pattern 1): no assert() in params.scad omits a clearance term (_clearance/_fit/_bias/_offset/_backlash-suffixed variable) that parts/*.scad geometry applies directly to a value the assert's own formula depends on -- catches a 'safe' margin verdict computed from nominal dimensions while the real, clearance-inflated geometry is tighter"
    applies: "file_exists:params.scad"
    kind: auto
    gate: "bash {skill_dir}/scripts/validate_scad.sh --all"
    # SKIP removed 2026-09-12, same reasoning as R-13: unreachable while `applies`
    # guards on params.scad, accepted would be a latent vacuous pass.
    success_pattern: "CHECK_RESULT margin_provenance=PASS"

  - id: R-16
    rule: "Parameter context manifest (2026-08-19 Phase-2 Pattern 3, opt-in via use_param() declarations): a params.scad value consumed for a hardware-fit purpose in 2+ contexts has each context's own assert() verifying it in the file that declared that context -- catches one context being verified while a different, incompatible context on the same shared value goes unchecked (e.g. one shaft diameter feeding two different bearing bores)"
    applies: "always"
    kind: auto
    gate: "bash {skill_dir}/scripts/validate_scad.sh --all"
    success_pattern: "CHECK_RESULT param_context=PASS"

  - id: R-18
    rule: "Attachment points (§7, added 2026-09-11): every declared fastener point in attachments.json has solid material behind it -- catches a part that shipped with no fastening features at all (a bare platform with no bosses, flanges or holes), which passes every other gate because connectivity checks whether a part is ONE body, never whether that body carries anything to attach with"
    applies: "file_exists:attachments.json"
    kind: auto
    gate: "bash {skill_dir}/scripts/validate_scad.sh --all"
    # SKIP removed 2026-09-12. attachments.json present with no built STLs used to
    # emit SKIP, which this pattern read as success -- so a project that declared
    # fastening points but rendered nothing scored R-18 PASS having checked
    # nothing. That state is now INCONCLUSIVE, and an absent file makes the rule
    # N/A via `applies`, so PASS is the only remaining outcome and it means the
    # points were actually examined.
    success_pattern: "CHECK_RESULT attachment=PASS"

  - id: R-17
    rule: "FDM printability (§7): each printed part was checked with check_printability.py for unsupported overhang and thin walls -- manual because it is new, not yet wired into validate_scad.sh --all, and its wall-thickness reading has a confirmed edge-case limitation (a solid, sharply-tapered feature's edge can produce a spuriously short reading) that needs a human/agent read of the result, not a bare pass/fail"
    applies: "always"
    kind: manual
    gate: null
