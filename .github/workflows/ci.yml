name: CI

# Two independent jobs, deliberately: `lint` catches syntax/schema errors in
# seconds with no external dependencies (useful signal on every PR); `selftest`
# is the real end-to-end proof (needs an actual OpenSCAD binary, ~1-2 min).
# A `lint` failure means something is definitely broken; a `selftest` failure
# on a fork/PR without network access to the OpenSCAD PPA is more likely an
# environment problem than a code problem -- read the log before assuming
# the worst.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    name: Syntax + schema check (no OpenSCAD needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile every Python script
        run: |
          set -e
          find . -name "*.py" -not -path "*/.git/*" -print0 \
            | xargs -0 -n1 python3 -m py_compile
          echo "OK: every .py file compiles"

      - name: Check every shell script's syntax
        run: |
          set -e
          find . -name "*.sh" -not -path "*/.git/*" -print0 \
            | xargs -0 -n1 bash -n
          echo "OK: every .sh file parses"

      - name: Validate JSON files parse
        run: |
          set -e
          find . -name "*.json" -not -path "*/.git/*" -print0 \
            | xargs -0 -n1 python3 -c "import json,sys; json.load(open(sys.argv[1]))"
          echo "OK: every .json file parses"

      - name: Validate rules_manifest.yaml parses and loads
        run: |
          python3 -c "
          import yaml
          with open('scad-modeler/rules_manifest.yaml') as f:
              d = yaml.safe_load(f)
          assert isinstance(d.get('rules'), list) and len(d['rules']) > 0
          print(f\"OK: {len(d['rules'])} rules loaded\")
          "

  selftest:
    name: End-to-end selftest (needs OpenSCAD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install OpenSCAD
        # Confirmed broken (2026-08-19, real CI run): ppa:openscad/releases
        # has no Release file for Ubuntu 24.04 "noble" -- 404 Not Found.
        # GitHub's own openscad/openscad "latest" release is also wrong for
        # this: it's 2021.01, which predates the --backend=Manifold flag
        # this skill depends on entirely (confirmed via `gh api
        # repos/openscad/openscad/releases/latest`). The flag only exists
        # in the nightly/snapshot builds OpenSCAD publishes at
        # files.openscad.org/snapshots/ -- the same channel
        # scad-modeler/references/setup-notes.md documents for macOS
        # (`brew install --cask openscad@snapshot`). Fetches the AppImage
        # dynamically (not a pinned filename, which would go stale) and
        # extracts it instead of running it directly, so no FUSE dependency
        # is needed. Download mechanism verified directly (confirmed a
        # valid, correctly-sized ELF AppImage at the constructed URL) --
        # the extract-and-run step itself is not yet verified against a
        # real Linux CI runner (this repo's development machine is macOS).
        run: |
          set -e
          LATEST=$(curl -sL "https://files.openscad.org/snapshots/" \
            | grep -oE 'OpenSCAD-[0-9.]+-x86_64\.AppImage"' | tr -d '"' \
            | sort -V | tail -1)
          echo "Latest snapshot: $LATEST"
          curl -sL -o openscad.AppImage "https://files.openscad.org/snapshots/$LATEST"
          chmod +x openscad.AppImage
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
          ./openscad.AppImage --appimage-extract
          sudo ln -s "$PWD/squashfs-root/AppRun" /usr/local/bin/openscad
          # README.md documents this same requirement for headless Linux:
          # OpenSCAD's CLI rendering needs an OpenGL context even without a
          # GUI, which needs a virtual framebuffer on a display-less CI
          # runner.
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum openscad --version

      - name: Report environment (doctor.py)
        run: xvfb-run --auto-servernum python3 scad-modeler/scripts/doctor.py
        continue-on-error: true # informational -- BOSL2/NopSCADlib aren't
        # installed in CI (selftest.py doesn't need them), so doctor.py is
        # expected to report a lower tier here than a fully set-up dev
        # machine; this step is diagnostic output, not a pass/fail gate.

      - name: Run selftest.py
        run: xvfb-run --auto-servernum python3 scad-modeler/scripts/selftest.py
